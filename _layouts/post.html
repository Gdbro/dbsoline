---
layout: default
---
<article class="post-shell">
  <header class="page-hero page-hero-simple post-hero">
    <div>
      <p class="eyebrow">Actualite</p>
      <h1>{{ page.title }}</h1>
      <p class="lead">{{ page.date | date: "%d/%m/%Y" }}</p>
      {% if page.image %}
        <img class="post-image" src="{{ page.image }}" alt="{{ page.title }}">
      {% endif %}
    </div>
  </header>

  <section class="content-panel prose">
    {{ content }}
  </section>
</article>
