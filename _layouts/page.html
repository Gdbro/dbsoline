---
layout: default
---
<section class="page-hero page-hero-simple">
  <div>
    <p class="eyebrow">Du Bruit Pour Soline</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p class="lead">{{ page.description }}</p>
    {% endif %}
    {% if page.hero_image %}
      <img class="post-image" src="{{ page.hero_image | relative_url }}" alt="{{ page.title }}">
    {% endif %}
  </div>
</section>

<section class="content-panel prose">
  {{ content }}
</section>
